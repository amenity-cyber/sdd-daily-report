name: CI and scheduled daily email

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 10 * * *' # 每天北京时间 18:00（UTC 10:00）
  workflow_dispatch:

permissions:
  contents: read

# 邮件任务不应被新的 CI 运行取消，避免 SMTP 已接受后产生重复或不确定状态。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Python ${{ matrix.python-version }} · tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install httpx pyyaml jinja2 pytest

      - name: Run unit and API tests
        run: python -B -m pytest -q

      - name: Validate Render deployment blueprint
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          blueprint = yaml.safe_load(Path('render.yaml').read_text(encoding='utf-8'))
          service = blueprint['services'][0]
          assert service['runtime'] == 'python'
          assert service['autoDeployTrigger'] == 'checksPass'
          assert service['healthCheckPath'] == '/healthz'
          assert service['disk']['mountPath'] == '/var/data'
          assert '--host 0.0.0.0 --port $PORT' in service['startCommand']
          PY

      - name: Set up Node.js for browser tests
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright browser
        if: matrix.python-version == '3.11'
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        if: matrix.python-version == '3.11'
        env:
          WEB_TEST_PYTHON: python
        run: node tests/web_e2e.cjs

      - name: Upload browser test evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore

  send-daily-report:
    name: Send scheduled daily report
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: daily-report-email-${{ github.repository }}
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai
    # Third-party credentials are only available to a trusted scheduled run or
    # an explicit manual run on main. Pushes and PRs can only execute tests.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve Beijing report date
        id: report-date
        run: echo "value=$(python -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo("Asia/Shanghai")).date())')" >> "$GITHUB_OUTPUT"

      - name: Prepare delivery guard path
        run: mkdir -p data && touch data/daily-email-sent.txt

      - name: Restore today's delivery guard
        id: sent-cache
        uses: actions/cache/restore@v4
        with:
          path: data/daily-email-sent.txt
          key: daily-email-sent-${{ steps.report-date.outputs.value }}

      - name: Install dependencies
        if: steps.sent-cache.outputs.cache-hit != 'true'
        run: python -m pip install httpx pyyaml jinja2

      - name: Validate secrets and write ignored config
        if: steps.sent-cache.outputs.cache-hit != 'true'
        env:
          APP_CONFIG_YAML: ${{ secrets.APP_CONFIG_YAML }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          required = ('APP_CONFIG_YAML', 'LARK_APP_ID', 'LARK_APP_SECRET', 'SMTP_HOST', 'SMTP_USER', 'SMTP_PASSWORD')
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing required GitHub Actions secrets: ' + ', '.join(missing))
          Path('config.yaml').write_text(os.environ['APP_CONFIG_YAML'], encoding='utf-8')
          PY

      - name: Generate and email daily report
        if: steps.sent-cache.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python main.py --email-only
          mkdir -p data
          echo "${{ steps.report-date.outputs.value }}" > data/daily-email-sent.txt

      - name: Save today's delivery guard
        if: success() && steps.sent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/daily-email-sent.txt
          key: daily-email-sent-${{ steps.report-date.outputs.value }}
