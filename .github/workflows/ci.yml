name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} · tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install httpx pyyaml jinja2 pytest

      - name: Run unit and API tests
        run: python -B -m pytest -q

      - name: Set up Node.js for browser tests
        if: matrix.python-version == '3.11'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright browser
        if: matrix.python-version == '3.11'
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        if: matrix.python-version == '3.11'
        env:
          WEB_TEST_PYTHON: python
        run: node tests/web_e2e.cjs

      - name: Upload browser test evidence
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
