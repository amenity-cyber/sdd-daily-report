<!doctype html>
<!-- OpenDesign 管理面板：由本地服务提供页面，数据来自 Mock 联调 API。 -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智能日报生成器 · 管理面板</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <!-- ═══ 顶栏 ═══ -->
  <header class="topbar" data-od-id="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">DR</span>
        <span class="brand-name">智能日报生成器</span>
        <span class="pill">SDD · v0.2</span>
      </div>
      <div class="topbar-actions">
        <!-- 明确标记模拟数据范围 -->
        <span class="pill pill--warn">模拟数据 · 本地联调</span>
        <button class="btn btn-ghost btn-sm" type="button" id="aboutBtn">关于</button>
      </div>
    </div>
  </header>

  <div class="app-body">

    <!-- ═══ 侧栏：按状态筛选 ═══ -->
    <aside class="sidebar" data-od-id="sidebar">
      <nav aria-label="按状态筛选任务">
        <p class="nav-label">任务状态</p>
        <!-- 状态筛选与后端状态一致 -->
        <button class="nav-item is-active" type="button" data-filter="all">全部任务 <span class="count" data-count="all">0</span></button>
        <button class="nav-item" type="button" data-filter="未开始">未开始 <span class="count" data-count="未开始">0</span></button>
        <button class="nav-item" type="button" data-filter="进行中">进行中 <span class="count" data-count="进行中">0</span></button>
        <button class="nav-item" type="button" data-filter="已完成">已完成 <span class="count" data-count="已完成">0</span></button>
      </nav>
      <div class="sidebar-foot">
        <p class="nav-label">演示说明</p>
        <p class="meta">日报使用模拟工作记录生成，保存到本机。演示不发送邮件或飞书通知。</p>

      </div>
    </aside>

    <!-- ═══ 主内容 ═══ -->
    <main class="main" id="content">

      <!-- 页头 -->
      <div class="page-head" data-od-id="page-head">
        <div>
          <p class="eyebrow">Daily Report · 管理面板</p>
          <h1>日报任务</h1>
          <p class="lead">从模拟工作记录生成完整日报，保存在本机，随时查看、复制或导出。同一天再次生成会更新当日日报。</p>
        </div>
        <!-- 本页唯一的主操作按钮 -->
        <button class="btn btn-primary" type="button" id="createBtn" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          生成新日报
        </button>
      </div>

      <p id="loadStatus" class="load-status" role="status">正在加载日报…</p>
      <div id="loadError" class="load-error" role="alert" hidden>
        <span id="loadErrorText"></span>
        <button id="retryBtn" class="btn btn-secondary btn-sm" type="button">重新加载</button>
      </div>

      <!-- KPI 概览 -->
      <section class="kpi-row" data-od-id="kpi-row" aria-label="任务概览">
        <div class="kpi">
          <div class="kpi-label">任务总数</div>
          <div class="kpi-value num" id="kpiTotal">0</div>
          <div class="kpi-sub">当前展示的全部日报任务</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">进行中</div>
          <div class="kpi-value num" id="kpiRunning">0</div>
          <div class="kpi-sub">当前页面正在生成的日报</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">已完成</div>
          <div class="kpi-value num" id="kpiDone">0</div>
          <div class="kpi-sub">已生成并保存到本机</div>
        </div>
        <div class="kpi">
          <div class="kpi-label">最近日报日期</div>
          <div class="kpi-value num kpi-date" id="kpiDate">—</div>
          <div class="kpi-sub">来自本地保存的日报记录</div>
        </div>
      </section>

      <!-- 任务表格 -->
      <section class="panel" data-od-id="task-table">
        <div class="toolbar">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <label class="sr-only" for="searchInput">搜索任务</label>
            <input id="searchInput" type="search" placeholder="搜索任务编号、名称或负责人…" autocomplete="off" />
          </div>
          <span class="meta" id="resultCount" aria-live="polite"></span>
        </div>

        <div class="table-wrap">
          <table class="ds-table">
            <thead>
              <tr>
                <th scope="col">任务编号</th>
                <th scope="col">任务名称</th>
                <th scope="col">状态</th>
                <th scope="col" class="col-time">生成时间</th>
                <th scope="col" class="col-action">操作</th>
              </tr>
            </thead>
            <!-- 行由脚本渲染，便于筛选与搜索 -->
            <tbody id="taskBody"></tbody>
          </table>
        </div>

        <!-- 空状态 -->
        <div class="empty" id="emptyState" hidden>
          <strong id="emptyTitle">暂无日报</strong>
          <span id="emptyDescription">点击生成新日报开始。</span>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- ═══ 日报详情弹窗 ═══ -->
<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modal">
    <div class="modal-head">
      <div>
        <span class="badge" id="modalBadge"></span>
        <h2 id="modalTitle">—</h2>
        <p class="meta" id="modalSubtitle">—</p>
      </div>
      <button class="icon-btn" type="button" id="modalClose" aria-label="关闭详情">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <button class="btn btn-ghost" type="button" id="modalCopy">复制正文</button>
      <button class="btn btn-secondary" type="button" id="modalExport">导出 Markdown</button>
    </div>
  </div>
</div>

<!-- ═══ 轻提示 ═══ -->
<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js" defer></script>
</body>
</html>
